name: Dashboard Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
        type: string

env:
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  guard:
    name: Confirm deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation was not 'deploy'. Aborting."
            exit 1
          fi

  deploy:
    name: Build and deploy dashboard
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get deployment values from AWS
        id: tf
        run: |
          # Get S3 bucket — named corelink-dashboard-<account-id>
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="corelink-dashboard-${ACCOUNT_ID}"
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT

          # Get WebSocket URL from API Gateway
          API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='corelink-ws'].ApiId" \
            --output text)
          WS_URL="wss://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
          echo "ws_url=${WS_URL}" >> $GITHUB_OUTPUT

          # Get REST API URL from API Gateway
          REST_API_ID=$(aws apigatewayv2 get-apis \
            --query "Items[?Name=='corelink-agent-api'].ApiId" \
            --output text)
          REST_URL="https://${REST_API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com"
          echo "api_url=${REST_URL}" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/dashboard/package.json

      - name: Install dependencies
        working-directory: app/dashboard
        run: npm install

      - name: Build
        working-directory: app/dashboard
        env:
          VITE_WS_URL: ${{ steps.tf.outputs.ws_url }}
          VITE_API_URL: ${{ steps.tf.outputs.api_url }}
        run: npm run build

      - name: Deploy to S3
        run: |
          aws s3 sync app/dashboard/dist s3://${{ steps.tf.outputs.bucket }} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp app/dashboard/dist/index.html s3://${{ steps.tf.outputs.bucket }}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='Corelink agent dashboard'].Id" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
